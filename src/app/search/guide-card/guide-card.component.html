<div class="guide-card">
  <div class="guide-header">
    <img [src]="guide.profileImageUrl" [alt]="guide.name" class="guide-image">
    <div class="guide-info">
      <h3 class="guide-name">{{guide.name}}</h3>
      <div class="rating">
        <span class="stars">{{getRatingStars()}}</span>
        <span class="rating-value">{{guide.rating}}</span>
      </div>
      <div class="experience">
        <span class="icon">🎓</span>
        <span>{{guide.experienceYears}} years experience</span>
      </div>
    </div>
  </div>

  <div class="guide-details">
    <p class="bio">{{guide.bio}}</p>

    <div class="detail-section">
      <div class="detail-label">
        <span class="icon">🗣️</span>
        <span>Languages</span>
        <div class="languages">
        <!-- <span class="language-badge" *ngFor="let lang of guide.languages">{{lang}}</span> -->
        <span class="language-badge" >{{guide.languages}}</span>
      </div>
      </div>
      <!-- <div class="languages"> -->
        <!-- <span class="language-badge" *ngFor="let lang of guide.languages">{{lang}}</span> -->
        <!-- <span class="language-badge" >{{guide.languages}}</span> -->
      <!-- </div> -->
    </div>

    <!-- <div class="detail-section">
      <div class="detail-label">
        <span class="icon">⭐</span>
        <span>Specialties</span>
      </div> -->
      <!-- <div class="specialties">
        <span class="specialty-badge" *ngFor="let specialty of guide.specialties">{{specialty}}</span>
      </div> -->
    <!-- </div> -->

    <div class="availability-price">
      <div class="availability">
        <!-- <span class="icon">📅</span>
        <span class="availability-status">{{guide.availability ? 'Available' : 'Not Available' }}</span> -->
        <span class="price-label">Hourly Rate:</span>
      </div>
      <div class="price">
        <!-- <span class="price-label">Hourly Rate:</span> -->
        <span class="price-value">₹{{guide.hourlyRate | number:'1.2-2'}}/hr</span>
      </div>
    </div>
  </div>

  <button class="book-button" (click)="onBook()">
    <span class="icon">📅</span>
    Book This Guide
  </button>
</div>
